[project]
name = "nutri-check-backend"
version = "0.1.0"
description = "Nutri-Check Backend API"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0.0",
    "djangorestframework>=3.15.0",
    "django-cors-headers>=4.3.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
